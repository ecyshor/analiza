services:
  traefik:
    image: "traefik:v2.11"
    labels:
      logging_jobname: "traefik"
    container_name: "traefik"
    restart: unless-stopped
    command:
      #- "--log.level=DEBUG"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      # The Docker API is only reachable through the socket proxy, which
      # exposes a minimal read-only subset of it.
      - "--providers.docker.endpoint=tcp://docker-socket-proxy:2375"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.web.forwardedHeaders.trustedIPs=10.0.0.0/16"
      - "--entrypoints.web.proxyProtocol=true"
      - "--entrypoints.web.proxyProtocol.trustedIPs=10.0.0.0/16"
      # Prometheus metrics on their own entrypoint, published on the host's
      # loopback only so the host Alloy agent can scrape them; no router
      # serves this entrypoint publicly.
      - "--entrypoints.metrics.address=:8082"
      - "--metrics.prometheus=true"
      - "--metrics.prometheus.entrypoint=metrics"
      - "--metrics.prometheus.addrouterslabels=true"
    ports:
      - "${ANALIZA_HTTP_BIND:-0.0.0.0}:8080:80"
      - "127.0.0.1:8082:8082"
    networks:
      - default
      - socket-proxy
    depends_on:
      - docker-socket-proxy

  # Read-only proxy for the Docker socket: traefik never mounts the socket
  # itself and can only list containers/networks through the proxy.
  docker-socket-proxy:
    image: "tecnativa/docker-socket-proxy:v0.5.0"
    environment:
      - CONTAINERS=1
      - NETWORKS=1
      - POST=0
    volumes:
      - "${DOCKER_SOCK:-/var/run/docker.sock}:/var/run/docker.sock:ro"
    networks:
      - socket-proxy
    labels:
      - "logging_exclude=true"
    restart: unless-stopped

  eye:
    build:
      context: ./eye
    depends_on:
      clickhouse:
        condition: service_healthy
      eye_flyway:
        condition: service_completed_successfully
    environment:
      - CLICKHOUSE_HOST=clickhouse
      - POSTGRES_HOST=postgres
      - CLICKHOUSE_PASSWORD=${ANALIZA_EYE_CH_PASSWORD:-eye_super_password}
      - POSTGRES_PASSWORD=${ANALIZA_EYE_PG_PASSWORD:-super_secret_password}
      - ANALIZA_HASH_SEED=${ANALIZA_HASH_SEED:-f308a5663791e49baa095c4c8a2bc046dbd79f07065f59c713817c5443b46d86}
    deploy:
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s
    labels:
      - "logging_jobname=eye"
      - "traefik.enable=true"
      - "traefik.port=8080"
      - "traefik.http.routers.api.rule=Host(`api.analiza.dev`) || Host(`api.dev.analiza.lan`)"
      - "traefik.http.routers.api.entrypoints=web"
      - "traefik.http.routers.api.middlewares=cors2"
      - "traefik.http.middlewares.cors2.headers.accesscontrolallowmethods=*"
      - "traefik.http.middlewares.cors2.headers.accesscontrolallowheaders=*"
      - "traefik.http.middlewares.cors2.headers.accesscontrolalloworiginlist=*"
      - "traefik.http.middlewares.cors2.headers.accesscontrolmaxage=200"
      - "traefik.http.middlewares.cors2.headers.addvaryheader=true"
  clickhouse:
    image: docker.io/clickhouse/clickhouse-server:26.8.36.3
    environment:
      - CLICKHOUSE_USER=eye_admin
      - CLICKHOUSE_PASSWORD=${ANALIZA_CH_ADMIN_PASSWORD:-eye_super_duper_password}
      - CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT=1
      - ANALIZA_EYE_CH_PASSWORD=${ANALIZA_EYE_CH_PASSWORD:-eye_super_password}
    labels:
      - "logging_exclude=true"
    volumes:
      - ./eye/clickhouse/init:/docker-entrypoint-initdb.d
      - ./eye/clickhouse/config.d/logs.xml:/etc/clickhouse-server/config.d/logs.xml:ro
      - type: bind
        source: ${ANALIZA_DATA_DIR:-/data/analiza}/clickhouse-server
        target: /var/lib/clickhouse
        bind:
          create_host_path: true
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "clickhouse-client -u $${CLICKHOUSE_USER} --password $${CLICKHOUSE_PASSWORD} -q 'SELECT 1'",
        ]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    deploy:
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s
      resources:
        limits:
          cpus: "4"
          memory: 8G
  metabase:
    image: "metabase/metabase:v0.65.2.4"
    container_name: "metabase"
    environment:
      - MB_DB_TYPE=postgres
      - MB_DB_DBNAME=metabase
      - MB_DB_PORT=5432
      - MB_DB_USER=metabase
      - MB_DB_PASS=${ANALIZA_METABASE_DB_PASSWORD:-metabase_super_password}
      - MB_DB_HOST=postgres
      - MB_REDIRECT_ALL_REQUESTS_TO_HTTPS=false
    depends_on:
      clickhouse:
        condition: service_healthy
      postgres:
        condition: service_healthy
    labels:
      - "logging_jobname=metabase"
      - "traefik.enable=true"
      - "traefik.port=3000"
      # Public embed endpoints: no IP restriction, higher priority so they
      # win over the admin router below.
      - "traefik.http.routers.metabase-public.rule=(Host(`metabase.analiza.dev`) || Host(`metabase.dev.analiza.lan`)) && (PathPrefix(`/embed`) || PathPrefix(`/public`) || PathPrefix(`/app`) || PathPrefix(`/api/embed`) || PathPrefix(`/api/public`) || Path(`/api/session/properties`) || Path(`/api/geojson`) || Path(`/api/health`))"
      - "traefik.http.routers.metabase-public.entrypoints=web"
      - "traefik.http.routers.metabase-public.priority=100"
      # Everything else on the metabase hosts is admin-only, restricted by IP.
      - "traefik.http.routers.metabase.rule=Host(`metabase.analiza.dev`) || Host(`metabase.dev.analiza.lan`)"
      - "traefik.http.routers.metabase.entrypoints=web"
      - "traefik.http.routers.metabase.middlewares=metabase-admin-ipallowlist"
      - "traefik.http.middlewares.metabase-admin-ipallowlist.ipallowlist.sourcerange=${ANALIZA_METABASE_ADMIN_ALLOWLIST:-0.0.0.0/0,::/0}"
    deploy:
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s
      resources:
        limits:
          cpus: "2"
          memory: 2G
        reservations:
          cpus: "0.1"
          memory: 500M
    healthcheck:
      test: curl --fail -I http://localhost:3000/api/health || exit 1
      interval: 15s
      timeout: 5s
      retries: 5
  postgrest:
    image: postgrest/postgrest:v14.13
    command:
      - "postgrest"
      - "/config/postgrest.conf"
    depends_on:
      postgrest_flyway:
        condition: service_completed_successfully
    volumes:
      - type: bind
        source: ${ANALIZA_POSTGREST_CONFIG:-./postgrest/postgrest.basic.conf}
        target: /config/postgrest.conf
        read_only: true
    deploy:
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s
    labels:
      - "logging_jobname=postgrest"
      - "traefik.enable=true"
      - "traefik.port=3000"
      - "traefik.http.routers.admin.rule=Host(`admin.analiza.dev`) || Host(`admin.dev.analiza.lan`)"
      - "traefik.http.routers.admin.entrypoints=web"
      - "traefik.http.routers.admin.middlewares=cors"
      - "traefik.http.middlewares.cors.headers.accesscontrolallowmethods=*"
      - "traefik.http.middlewares.cors.headers.accesscontrolallowheaders=*"
      - "traefik.http.middlewares.cors.headers.accesscontrolalloworiginlist=${ANALIZA_ADMIN_CORS_ORIGINS:-https://app.analiza.dev, http://app.dev.analiza.lan, http://localhost:5174, http://localhost:5175}"
      - "traefik.http.middlewares.cors.headers.accesscontrolmaxage=200"
      - "traefik.http.middlewares.cors.headers.addvaryheader=true"
  postgrest_flyway:
    image: flyway/flyway:13.12.1
    command: -url=jdbc:postgresql://postgres:5432/eye_admin -user=postgres -password=${ANALIZA_POSTGRES_PASSWORD:-super_secret_password} -connectRetries=60 migrate
    volumes:
      - ./postgrest/schema:/flyway/sql
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s
  swagger:
    image: swaggerapi/swagger-ui:v5.34.1
    profiles:
      - dev
    environment:
      API_URL: http://admin.dev.analiza.lan/
    deploy:
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.swagger.rule=Host(`openapi.dev.analiza.lan`)"
      - "traefik.http.routers.swagger.entrypoints=web"
      - "traefik.http.services.swagger.loadbalancer.server.port=8080"
  eye_flyway:
    image: flyway/flyway:13.12.1
    command: -url=jdbc:postgresql://postgres:5432/eye_admin -defaultSchema=eye -user=postgres -password=${ANALIZA_POSTGRES_PASSWORD:-super_secret_password} -connectRetries=60 migrate
    volumes:
      - ./eye/postgres/schema:/flyway/sql
    depends_on:
      postgres:
        condition: service_healthy
      # eye's schema grants on api.domains, created by the postgrest migrations
      postgrest_flyway:
        condition: service_completed_successfully
    deploy:
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s
  postgres:
    # 18+ images default PGDATA to /var/lib/postgresql/<major>/docker, so the
    # host dir is ${ANALIZA_DATA_DIR}/postgres/18/docker (see postgres/README.md).
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${ANALIZA_POSTGRES_PASSWORD:-super_secret_password}
      POSTGRES_DB: postgres
      ANALIZA_METABASE_DB_PASSWORD: ${ANALIZA_METABASE_DB_PASSWORD:-metabase_super_password}
    command: ["postgres", "-c", "log_statement=ddl", "-c", "log_min_duration_statement=1000", "-c", "log_parameter_max_length=0"]
    labels:
      - "logging_exclude=true"
    logging:
      driver: json-file
      options: { max-size: "50m", max-file: "3" }
    volumes:
      - ./postgres/init:/docker-entrypoint-initdb.d/
      - type: bind
        source: ${ANALIZA_DATA_DIR:-/data/analiza}/postgres
        target: /var/lib/postgresql
    deploy:
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

networks:
  default: {}
  # Internal-only network shared between traefik and the docker socket proxy.
  socket-proxy:
    internal: true
